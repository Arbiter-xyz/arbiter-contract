# Machine‑readable audit changelog for arbiter‑contract
# This file captures each security finding and its remediation.
# It is intended to be updated manually when new audit rounds are completed.
# Each entry contains:
#   id: Unique identifier for the finding (e.g., "R3-001")
#   severity: one of [critical, high, medium, low]
#   round: audit round number (integer)
#   component: contract | backend | frontend
#   description: short description of the issue
#   fix_commit_or_pr: Git commit SHA or PR number that implements the fix
#   verification: how the fix was verified (tests, manual review, etc.)

- id: R3-001
  severity: high
  round: 3
  component: contract
  description: Timeout retroactivity – pending question could be resolved after timeout.
  fix_commit_or_pr: 9f2c1e7
  verification: |
    regression test: `set_timeout_ledgers_does_not_affect_an_already_pending_question`

