[package]
name = "oracle-escrow"
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "23"

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
serde_json = "1"
soroban-sdk = { version = "23", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
# Test fixtures only, built by scripts/build-wasm.sh. Never deploy either.
# The "v3" contract for the upgrade worked example (version() == 3).
upgrade-test-v3 = []
# Lifts MAX_QUORUM_SIZE so the resource sweep can measure past it.
bench-uncapped-quorum = []

[workspace]
# The standalone Rust client crate (issue #69) lives in client/ and is a
# workspace member so `cargo build -p oracle-escrow-client` works from the
# repo root. It is intentionally NOT a dependency of this contract crate:
# it wraps the generated `OracleEscrowClient` and can be published on its
# own release cycle.
members = ["client"]

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# The economics simulations drive the v0.2.0 Wasm through thousands of
# invocations; an unoptimized wasmi/host makes that take minutes. Optimizing
# dependencies (not this crate) keeps `cargo test` fast without changing what
# the tests compile.
[profile.dev.package."*"]
opt-level = 2
