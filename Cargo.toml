[package]
name = "oracle-escrow"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "23"

[dev-dependencies]
soroban-sdk = { version = "23", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# The economics simulations drive the v0.2.0 Wasm through thousands of
# invocations; an unoptimized wasmi/host makes that take minutes. Optimizing
# dependencies (not this crate) keeps `cargo test` fast without changing what
# the tests compile.
[profile.dev.package."*"]
opt-level = 2
