[workspace]
resolver = "2"
# contracts/oracle-escrow is docs only (INVOKE_EXAMPLES.md, no crate) — the
# real oracle-escrow crate is this workspace's own root package below.
# contracts/fee-vesting is a real second contract (cliff-then-linear vesting
# for platform fee revenue) that already expects this parent workspace via
# its own `soroban-sdk = { workspace = true }`.
members = ["contracts/fee-vesting"]
# cargo-fuzz manages the fuzz crate in fuzz/ as an excluded non-workspace
# member to avoid conflicting with the release profile and WASM build.
exclude = ["fuzz"]

[workspace.dependencies]
soroban-sdk = "23"

[package]
name = "oracle-escrow"
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
serde_json = "1"
soroban-sdk = { workspace = true, features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
# Test fixtures only, built by scripts/build-wasm.sh. Never deploy either.
# The "v3" contract for the upgrade worked example (version() == 3).
upgrade-test-v3 = []
# Lifts MAX_QUORUM_SIZE so the resource sweep can measure past it.
bench-uncapped-quorum = []

# NOTE: a standalone Rust client crate (issue #69) and a `cargo bench`
# harness (issue #65, benches/resources.rs) were both previously claimed as
# delivered but neither exists on disk — client/ doesn't exist and bench/
# only holds a JSON settings file, not a Rust benchmark harness. Removed
# the duplicate `[workspace] members = ["client"]` table (a Cargo.toml with
# two [workspace] tables is a hard parse error) and the `[[bench]]` entry
# pointing at a nonexistent file. Tracked as open work, not re-faked here.

# Size-oriented release profile (issue #64). `stellar contract build` compiles
# with this profile and then runs wasm-opt, so the deployed bytecode is the
# post-wasm-opt artifact. These settings are the size budget's first line of
# defense; the measured size is recorded in the README and surfaced by CI.
[profile.release]
opt-level = "z"
overflow-checks = true
debug = false
strip = "symbols"
debug-assertions = false
codegen-units = 1
lto = true
panic = "abort"
