name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      contract_id:
        description: 'Deployed contract id to verify against (defaults to pinned testnet address)'
        required: false
        default: 'CDEZRLCBSRMWT5YLJ5UH3SKLNM5GVTL5TGBWDBMMBEBCFKIG3ZSS5W36'

env:
  # Pinned testnet deployment. Override via workflow_dispatch input or by
  # setting the CONTRACT_ID repository variable for a future mainnet deploy.
  DEFAULT_CONTRACT_ID: CDEZRLCBSRMWT5YLJ5UH3SKLNM5GVTL5TGBWDBMMBEBCFKIG3ZSS5W36
  # Must match rust-toolchain.toml, ci.yml, and scripts/build-wasm.sh so the
  # release artifact is byte-for-byte reproducible with local builds.
  RUST_TOOLCHAIN: '1.89.0'
  WASM_TARGET: wasm32v1-none

permissions:
  contents: read

jobs:
  build:
    name: Build optimized WASM
    runs-on: ubuntu-latest
    outputs:
      wasm_hash: ${{ steps.hash.outputs.wasm_hash }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc  # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ env.WASM_TARGET }}

      - name: Install Stellar CLI
        run: |
          curl -fsSLO https://github.com/stellar/stellar-cli/releases/download/v27.1.0/stellar-cli_27.1.0_amd64.deb
          echo "d059dd037c386edc396ea81b109cc533f0be146ec1e2241a8210f1cbd07887ff  stellar-cli_27.1.0_amd64.deb" | sha256sum -c -
          sudo dpkg -i stellar-cli_27.1.0_amd64.deb || sudo apt-get install -f -y

      - name: Build contract WASM
        run: stellar contract build

      - name: Compute local WASM hash
        id: hash
        run: |
          # Name the escrow artifact explicitly: the workspace also builds fee_vesting.wasm.
          WASM=target/${{ env.WASM_TARGET }}/release/oracle_escrow.wasm
          if [ ! -f "$WASM" ]; then
            echo "::error::No oracle_escrow.wasm produced by 'stellar contract build'"
            exit 1
          fi
          echo "Local artifact: $WASM"
          HASH=$(sha256sum "$WASM" | awk '{print $1}')
          echo "wasm_hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "wasm_path=$WASM" >> "$GITHUB_OUTPUT"
          echo "Local WASM sha256: $HASH"
          sha256sum "$WASM" > "${WASM}.sha256"

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: contract-wasm
          path: |
            ${{ steps.hash.outputs.wasm_path }}
            ${{ steps.hash.outputs.wasm_path }}.sha256
          retention-days: 90

      - name: Upload WASM and hash as workflow artifact
        # Saves the bytecode and sidecar .sha256 file so the verify-hash job
        # and any downstream release step can retrieve them without re-building
        # (issue #497).
        uses: actions/upload-artifact@v4
        with:
          name: contract-wasm
          path: |
            ${{ steps.hash.outputs.wasm_path }}
            ${{ steps.hash.outputs.wasm_path }}.sha256
          if-no-files-found: error

      - name: Attach WASM to GitHub Release
        # Only when this run was triggered by a tag push (a real release).
        # workflow_dispatch runs are verification-only and do not publish assets.
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.hash.outputs.wasm_path }}
            ${{ steps.hash.outputs.wasm_path }}.sha256

  verify-hash:
    name: Verify deployed WASM hash
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install Stellar CLI
        run: |
          curl -fsSLO https://github.com/stellar/stellar-cli/releases/download/v27.1.0/stellar-cli_27.1.0_amd64.deb
          echo "d059dd037c386edc396ea81b109cc533f0be146ec1e2241a8210f1cbd07887ff  stellar-cli_27.1.0_amd64.deb" | sha256sum -c -
          sudo dpkg -i stellar-cli_27.1.0_amd64.deb || sudo apt-get install -f -y

      - name: Resolve target contract id
        id: target
        run: |
          CONTRACT_ID="${{ github.event.inputs.contract_id }}"
          if [ -z "$CONTRACT_ID" ]; then
            CONTRACT_ID="${{ vars.CONTRACT_ID }}"
          fi
          if [ -z "$CONTRACT_ID" ]; then
            CONTRACT_ID="$DEFAULT_CONTRACT_ID"
          fi
          echo "contract_id=$CONTRACT_ID" >> "$GITHUB_OUTPUT"
          echo "Verifying against contract id: $CONTRACT_ID"

      - name: Fetch deployed WASM from chain
        id: onchain
        run: |
          CONTRACT_ID="${{ steps.target.outputs.contract_id }}"
          mkdir -p onchain
          stellar contract fetch \
            --id "$CONTRACT_ID" \
            --network testnet \
            --out-file onchain/deployed.wasm
          HASH=$(sha256sum onchain/deployed.wasm | awk '{print $1}')
          echo "onchain_hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "On-chain WASM sha256: $HASH"

      - name: Diff local vs on-chain WASM hash
        run: |
          LOCAL="${{ needs.build.outputs.wasm_hash }}"
          ONCHAIN="${{ steps.onchain.outputs.onchain_hash }}"
          echo "Local   : $LOCAL"
          echo "On-chain: $ONCHAIN"
          if [ "$LOCAL" != "$ONCHAIN" ]; then
            echo "::error::WASM hash mismatch for contract ${{ steps.target.outputs.contract_id }} — deployed bytecode does not match this commit's build."
            echo "This means the deployed contract was NOT built from the current source (or the build is not reproducible)."
            exit 1
          fi
          echo "::notice::WASM hash verified: deployed contract matches this commit's build."

  publish-release:
    name: Attach WASM to GitHub Release
    # Only runs on tag pushes — not on workflow_dispatch verification runs.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [build, verify-hash]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: contract-wasm
          path: dist/

      - name: Attach WASM and hash to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
