name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      contract_id:
        description: "Deployed contract id to verify against"
        required: false
        default: "CDEZRLCBSRMWT5YLJ5UH3SKLNM5GVTL5TGBWDBMMBEBCFKIG3ZSS5W36"

jobs:
  contract:
    name: contract (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      - name: cargo audit
        run: cargo audit
      - name: cargo test
        run: cargo test
      - name: Doc-comment coverage lint
        # Enforces rustdoc's missing-docs lint on the crate so undocumented
        # public items (e.g. get_balance, get_stake, get_owed) are caught in
        # CI instead of relying on a reviewer to notice the gap.
        #
        # NOTE (issue #216): the crate currently has a large pre-existing
        # backlog of missing docs (~436 errors spanning structs, fields,
        # statics, and the crate root). Enforcing `-D missing_docs` outright
        # would fail CI on that backlog rather than on new regressions, so
        # the lint is run in report-only mode here: it surfaces the current
        # count in the job summary without failing the build. The backlog is
        # being closed incrementally per module; once it reaches zero this
        # step should be flipped back to `-D missing_docs` (hard gate).
        run: |
          set -euo pipefail
          OUT=$(RUSTFLAGS="-W missing_docs" cargo check --lib 2>&1 || true)
          COUNT=$(printf '%s\n' "$OUT" | grep -c '^warning: missing documentation' || true)
          echo "### Doc-comment coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "- missing-docs warnings: ${COUNT}" >> "$GITHUB_STEP_SUMMARY"
          echo "- status: report-only (see issue #216 for the incremental plan)" >> "$GITHUB_STEP_SUMMARY"
          echo "missing-docs warnings: ${COUNT}"
      - name: Slashing model claims
        # Asserts every number docs/economics/slashing-threat-model.md cites
        # from the closed-form model, and that the committed tables are
        # current.
        run: |
          python3 sim/slashing_model.py --check
          python3 sim/slashing_model.py > /tmp/tables.md
          diff <(tail -n +8 docs/economics/model-tables.md) /tmp/tables.md
      - name: Incentive simulation self-checks
        # sim/incentive is a standalone crate (issue #117). Its contract
        # equivalence proof runs in the main `cargo test` above
        # (src/test_incentive_math.rs); this runs the model's own tests.
        run: cargo test --manifest-path sim/incentive/Cargo.toml
      - name: Migration tool syntax
        run: node --check tools/migrate/migrate.mjs && node --check tools/migrate/e2e-testnet.mjs && node --check tools/load/load.mjs && node --check tools/shadow/shadow.mjs && node --check tools/chaos/chaos.mjs && node --check tools/chaos/proxy.mjs && node --check tools/chaos/retry.mjs
      - name: Install Stellar CLI
        # Prebuilt .deb instead of cargo install: building from source pulls
        # in hardware-wallet support (dbus, then libudev/hidapi) and takes
        # 10+ minutes. Pinned to the version this project was built against.
        run: |
          curl -LO https://github.com/stellar/stellar-cli/releases/download/v27.1.0/stellar-cli_27.1.0_amd64.deb
          sudo dpkg -i stellar-cli_27.1.0_amd64.deb || sudo apt-get install -f -y
      - name: Build contract and test fixtures to WASM
        run: scripts/build-wasm.sh
      - name: WASM size budget
        # Records the optimized contract bytecode size and fails if it
        # regresses past the 15.5KB baseline cited in the README. The size
        # is measured from the same `stellar contract build` output that
        # scripts/build-wasm.sh produces, so it is reproducible locally.
        run: |
          WASM=target/wasm32v1-none/release/escrow_contract.wasm
          if [ ! -f "$WASM" ]; then
            echo "::error::expected WASM artifact not found at $WASM"
            exit 1
          fi
          SIZE=$(stat -c%s "$WASM")
          echo "Optimized WASM size: ${SIZE} bytes ($(awk "BEGIN { printf \"%.1f\", $SIZE/1024 }" ) KB)"
          echo "### WASM size: ${SIZE} bytes" >> "$GITHUB_STEP_SUMMARY"
          BASELINE=15872 # 15.5KB
          if [ "$SIZE" -gt "$BASELINE" ]; then
            echo "::error::WASM size ${SIZE} bytes exceeds the ${BASELINE}-byte (15.5KB) baseline"
            exit 1
          fi
      - name: WASM-hash verification against deployed contract
        # Ties the deployed contract id pinned in the README to the lib.rs
        # commit under test: builds the WASM (same `stellar contract build`
        # output as above), fetches the deployed contract's on-chain WASM
        # hash, and fails loudly on any mismatch. This is only meaningful
        # because the build is reproducible (#115); a mismatch means either
        # the deployed bytecode drifted from this commit or the build is no
        # longer deterministic. There is no incident-alerting wiring in this
        # repo, so the failure path is a hard CI failure (non-zero exit).
        env:
          CONTRACT_ID: ${{ github.event.inputs.contract_id || 'CDEZRLCBSRMWT5YLJ5UH3SKLNM5GVTL5TGBWDBMMBEBCFKIG3ZSS5W36' }}
          NETWORK: testnet
        run: |
          set -euo pipefail
          WASM=target/wasm32v1-none/release/escrow_contract.wasm
          if [ ! -f "$WASM" ]; then
            echo "::error::expected WASM artifact not found at $WASM"
            exit 1
          fi
          LOCAL_HASH=$(sha256sum "$WASM" | awk '{print $1}')
          echo "Local WASM sha256:  $LOCAL_HASH"
          # Fetch the deployed contract's bytecode and hash it locally so the
          # comparison is a plain sha256 of the same artifact shape.
          stellar contract fetch \
            --id "$CONTRACT_ID" \
            --network "$NETWORK" \
            --out-file /tmp/deployed.wasm
          DEPLOYED_HASH=$(sha256sum /tmp/deployed.wasm | awk '{print $1}')
          echo "Deployed WASM sha256: $DEPLOYED_HASH"
          echo "### WASM-hash verification" >> "$GITHUB_STEP_SUMMARY"
          echo "- contract id: \`$CONTRACT_ID\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- local:    \`$LOCAL_HASH\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- deployed: \`$DEPLOYED_HASH\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "$LOCAL_HASH" != "$DEPLOYED_HASH" ]; then
            echo "::error::WASM hash mismatch for $CONTRACT_ID: local $LOCAL_HASH != deployed $DEPLOYED_HASH"
            exit 1
          fi
          echo "WASM hash matches deployed contract $CONTRACT_ID"
      - name: Mainnet resource-settings staleness check
        # bench/mainnet-soroban-settings.json is a committed snapshot of
        # mainnet's resource limits that MAX_QUORUM_SIZE's safety margin
        # (docs/RESOURCE_LIMITS.md) is derived against. Nothing else re-fetches
        # it, so a protocol vote that tightens limits would go unnoticed until
        # someone manually re-ran scripts/fetch-network-settings.sh. Re-fetch
        # the live snapshot and fail if it differs from the committed one, so
        # drift surfaces in CI instead of silently invalidating the margin.
        # Non-blocking on network failure: a transient RPC outage should not
        # fail the build, but a successful fetch that disagrees must.
        run: |
          set -euo pipefail
          COMMITTED=bench/mainnet-soroban-settings.json
          if [ ! -f "$COMMITTED" ]; then
            echo "::error::committed snapshot $COMMITTED not found"
            exit 1
          fi
          if ! scripts/fetch-network-settings.sh > /tmp/live-settings.json 2>/tmp/fetch-err.log; then
            echo "::warning::could not fetch live mainnet settings; skipping staleness check"
            cat /tmp/fetch-err.log || true
            exit 0
          fi
          if ! diff -u "$COMMITTED" /tmp/live-settings.json; then
            echo "::error::$COMMITTED is stale relative to live mainnet settings"
            echo "Re-run scripts/fetch-network-settings.sh and review the diff against docs/RESOURCE_LIMITS.md."
            exit 1
          fi
          echo "Committed mainnet settings match live network"
      - name: WASM tests (mainnet resource-limit gate, upgrade worked example)
        # The benchmark sweep (bench_*) is for re-deriving MAX_QUORUM_SIZE by
        # hand, not a gate. See docs/RESOURCE_LIMITS.md.
        run: cargo test -- --ignored --skip bench_ --nocapture
      - name: Deep property-based fuzz run
        # `cargo test <filter>` exits 0 when the filter matches zero tests, so
        # a renamed/removed test or a missing `mod` declaration would silently
        # turn this step into a no-op. Assert the named test actually ran by
        # requiring at least one passing test in the output.
        run: |
          set -euo pipefail
          OUT=$(cargo test escrow_invariant_holds_for_every_call_sequence -- --nocapture 2>&1)
          echo "$OUT"
          if ! grep -Eq 'test result: ok\. [1-9][0-9]* passed' <<<"$OUT"; then
            echo "::error::property-fuzz step matched zero tests; the named test is not compiled in"
            exit 1
          fi
        env:
          PROPTEST_CASES: "1000"
      - name: Pre-flight gate (docs/UPGRADES.md step 2)
        # Issue #285: the pre-flight checklist in docs/UPGRADES.md tells
        # operators to run `scripts/build-wasm.sh && cargo test && cargo test
        # -- --ignored` before any real upgrade. That command is only usable
        # if it actually passes on the branch being released, so this step
        # runs the exact same sequence as a release-readiness gate. It is
        # intentionally a separate step from the individual `cargo test`
        # steps above so a failure here is attributable to the documented
        # pre-flight command rather than to a specific test target.
        run: |
          set -euo pipefail
          scripts/build-wasm.sh
          cargo test
          cargo test -- --ignored
